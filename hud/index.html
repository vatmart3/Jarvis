<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<script type="importmap">

<style>
  :root {
    --bg: #03060c;
    --cyan: #49c6ff;
    --cyan-soft: rgba(73, 198, 255, .55);
    --cyan-faint: rgba(73, 198, 255, .14);
    --text: #cfe9ff;
    --muted: #6f8aa6;
    --warn: #ffb547;
    --danger: #ff5d6c;
    --ok: #4dffb8;
    --mono: "Share Tech Mono", ui-monospace, monospace;
    --sans: "Rajdhani", "Avenir Next", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }

  /* ---------- Carte ---------- */
  #map { position: fixed; inset: 0; background: var(--bg); opacity: 0; transition: opacity 1.6s ease; }
  body.map-on #map { opacity: 1; }
  .leaflet-tile-pane { filter: sepia(1) hue-rotate(170deg) saturate(3.2) brightness(.82) contrast(1.15); transition: filter 1s; }
  body.style-osmdark .leaflet-tile-pane { filter: invert(1) grayscale(1) sepia(1) hue-rotate(170deg) saturate(2.6) brightness(.62) contrast(1.25); }
  body.style-satellite .leaflet-tile-pane { filter: saturate(.75) brightness(.8) contrast(1.1); }
  body.style-plan .leaflet-tile-pane { filter: none; }
  .zone { stroke: var(--cyan); stroke-width: 2; fill: rgba(73, 198, 255, .07); filter: drop-shadow(0 0 6px var(--cyan));
    stroke-dasharray: 3000; stroke-dashoffset: 3000; animation: draw 3.2s ease-out forwards; }
  .link { stroke: var(--cyan); stroke-width: 2; fill: none; filter: drop-shadow(0 0 5px var(--cyan));
    stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
  .route { stroke: var(--ok); stroke-width: 4; fill: none; filter: drop-shadow(0 0 7px var(--ok));
    stroke-dasharray: 8000; stroke-dashoffset: 8000; animation: draw 4s ease-in-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .leaflet-tooltip.plabel { background: rgba(3, 10, 20, .82); border: 1px solid var(--cyan-soft); color: var(--text); border-radius: 0;
    font-family: var(--sans); font-weight: 600; font-size: 14px; letter-spacing: .06em; padding: 3px 8px; box-shadow: 0 0 12px rgba(73, 198, 255, .2); }
  .leaflet-tooltip.plabel::before { display: none; }
  .pin.green { border-color: var(--ok); box-shadow: 0 0 14px var(--ok); }
  .pin .n { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-size: 9px; color: var(--cyan); }
  .pop { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both; }
  @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #scan { position: fixed; inset: 0; z-index: 403; pointer-events: none; opacity: 0;
    background: linear-gradient(180deg, transparent 0%, rgba(73, 198, 255, .0) 40%, rgba(73, 198, 255, .22) 50%, transparent 52%); background-size: 100% 220%; }
  body.scanning #scan { animation: scan 1.4s ease-out; }
  @keyframes scan { 0% { opacity: 1; background-position: 0 120%; } 100% { opacity: 0; background-position: 0 -20%; } }
  #maptitle { position: fixed; top: 36px; left: 50%; transform: translateX(-50%); z-index: 450; text-align: center; pointer-events: none;
    font-family: var(--sans); font-weight: 600; font-size: 22px; letter-spacing: .32em; text-transform: uppercase; color: var(--text);
    text-shadow: 0 0 14px var(--cyan-soft); opacity: 0; transition: opacity .8s; max-width: 50vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #maptitle small { display: block; font-family: var(--mono); font-weight: normal; font-size: 11px; letter-spacing: .2em; color: var(--muted); margin-top: 4px; }
  body.map-on #maptitle.show { opacity: 1; }

  /* ---------- Panneaux ---------- */
  /* Calque des panneaux : plein écran ; chaque panneau (.panel) est en position absolue, déplaçable à la main. */
  #panels { position: fixed; inset: 0; z-index: 455; pointer-events: none; perspective: 1100px; }
  #panels .panel { position: absolute; animation-fill-mode: backwards; width: min(380px, calc(100vw - 32px)); pointer-events: auto; --s: 1; --ry: -7deg; --tx: 0px; --ty: 0px;
    transform: translate(var(--tx), var(--ty)) rotateY(var(--ry)) scale(var(--s)); transform-origin: center;
    transition: left .5s cubic-bezier(.2, .9, .3, 1), top .5s cubic-bezier(.2, .9, .3, 1), box-shadow .2s; }
  #panels .panel.drag { transition: none; box-shadow: 0 0 40px rgba(73, 198, 255, .35); cursor: grabbing; }
  #panels .panel.vise { box-shadow: 0 0 34px rgba(73, 198, 255, .3); }
  #panels .panel.ejecte { transition: transform .55s cubic-bezier(.4, 0, 1, 1), opacity .55s; opacity: 0; }
  .card { position: relative; background: linear-gradient(160deg, rgba(10, 30, 50, .82), rgba(3, 10, 20, .88)); border: 1px solid var(--cyan-faint);
    border-left: 2px solid var(--cyan); padding: 14px 16px 14px 18px; box-shadow: 0 0 24px rgba(73, 198, 255, .1);
    animation: slidein .55s cubic-bezier(.2, .9, .3, 1) both; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .card.out { animation: slideout .4s ease-in forwards; }
  @keyframes slidein { from { opacity: 0; transform: translateX(60px); clip-path: inset(0 0 100% 0); } to { opacity: 1; transform: none; clip-path: inset(0 0 0 0); } }
  @keyframes slideout { to { opacity: 0; transform: translateX(60px); } }
  .card h4 { margin: 0 24px 10px 0; font-family: var(--mono); font-weight: normal; font-size: 11px; letter-spacing: .22em; color: var(--cyan); text-transform: uppercase; }
  .card .x { position: absolute; top: 8px; right: 8px; background: none; border: 0; color: var(--muted); font-family: var(--mono); font-size: 13px; cursor: pointer; padding: 4px 6px; }
  .card .x:hover, .card .x:focus-visible { color: var(--cyan); outline: none; }
  .card ul { margin: 0; padding: 0; list-style: none; }
  .card li { padding: 5px 0 5px 16px; position: relative; font-size: 16px; line-height: 1.3; border-bottom: 1px solid rgba(73, 198, 255, .07); animation: rise .4s ease both; }
  .card li::before { content: ""; position: absolute; left: 0; top: 12px; width: 6px; height: 6px; background: var(--cyan); transform: rotate(45deg); box-shadow: 0 0 6px var(--cyan); }
  .card li:last-child { border-bottom: 0; }
  .wx-now { display: flex; align-items: baseline; gap: 14px; }
  .wx-now .t { font-family: var(--sans); font-weight: 300; font-size: 56px; line-height: 1; color: var(--text); text-shadow: 0 0 18px var(--cyan-soft); }
  .wx-now .e { font-size: 18px; }
  .wx-now .e::first-letter { text-transform: uppercase; }
  .wx-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); margin: 6px 0 12px; letter-spacing: .06em; }
  .wx-days { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .wx-days div { border: 1px solid var(--cyan-faint); padding: 8px; text-align: center; font-size: 13px; }
  .wx-days b { display: block; font-family: var(--mono); font-weight: normal; font-size: 10px; color: var(--cyan); letter-spacing: .15em; text-transform: uppercase; margin-bottom: 4px; }
  .gauge { margin: 8px 0 12px; }
  .gauge .top { display: flex; justify-content: space-between; font-size: 15px; }
  .gauge .top span:last-child { font-family: var(--mono); color: var(--cyan); }
  .gauge .bar { height: 6px; background: rgba(73, 198, 255, .1); margin: 6px 0 4px; overflow: hidden; }
  .gauge .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), #9be3ff); box-shadow: 0 0 10px var(--cyan); transition: width 1.4s cubic-bezier(.2, .9, .3, 1); }
  .gauge.hot .bar i { background: linear-gradient(90deg, var(--warn), var(--danger)); box-shadow: 0 0 10px var(--warn); }
  .gauge small { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .route-info { display: flex; gap: 22px; }
  .route-info div { font-family: var(--sans); font-weight: 300; font-size: 34px; color: var(--text); }
  .route-info small { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .15em; color: var(--muted); }

  /* ---------- Minuteurs ---------- */
  #leftcol { position: fixed; z-index: 455; top: 112px; left: 48px; width: 270px; display: flex; flex-direction: column; gap: 12px;
    max-height: calc(100vh - 220px); overflow: hidden; }
  #timers, #widgets { display: flex; flex-direction: column; gap: 10px; }
  .wcard { position: relative; padding: 10px 12px 10px 14px; border-left: 2px solid var(--cyan-soft);
    background: linear-gradient(90deg, rgba(10, 30, 50, .55), rgba(3, 10, 20, 0)); animation: slidein .5s ease both; }
  .wcard .wt { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
  .wcard .big { font-family: var(--sans); font-weight: 300; font-size: 34px; line-height: 1.05; color: var(--text); text-shadow: 0 0 12px var(--cyan-soft); }
  .wcard .sub { font-size: 14px; color: var(--text); opacity: .8; }
  .wcard .sub::first-letter { text-transform: uppercase; }
  .wcard .note { font-size: 16px; line-height: 1.35; white-space: pre-wrap; }
  .wcard .mini { display: grid; grid-template-columns: 70px 1fr 34px; align-items: center; gap: 8px; font-size: 12px; margin: 3px 0; }
  .wcard .mini .bar { height: 4px; background: rgba(73, 198, 255, .12); }
  .wcard .mini .bar i { display: block; height: 100%; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); transition: width 1s; }
  .wcard .mini b { font-family: var(--mono); font-weight: normal; color: var(--cyan); text-align: right; }
  .wcard .wx { position: absolute; top: 6px; right: 4px; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; opacity: 0; transition: opacity .3s; }
  .wcard:hover .wx, .wcard .wx:focus-visible { opacity: 1; }
  body.ui-idle .wcard .wx { opacity: 0; }
  .timer { display: flex; align-items: center; gap: 12px; animation: slidein .5s ease both; }
  .timer svg { width: 54px; height: 54px; transform: rotate(-90deg); }
  .timer circle { fill: none; stroke-width: 3; }
  .timer .bg { stroke: rgba(73, 198, 255, .12); }
  .timer .fg { stroke: var(--cyan); stroke-linecap: round; filter: drop-shadow(0 0 4px var(--cyan)); transition: stroke-dashoffset 1s linear; }
  .timer .v { font-family: var(--mono); font-size: 24px; } .timer .l { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
  .timer.done .fg { stroke: var(--warn); } .timer.done { animation: blink .6s step-end infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  /* ---------- Choix de la voix ---------- */
  .leaflet-container { background: var(--bg); font-family: var(--sans); }
  .leaflet-control-attribution { background: rgba(3, 6, 12, .6) !important; color: var(--muted) !important; font-size: 10px; }
  .leaflet-control-attribution a { color: var(--muted) !important; }
  .pin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--cyan); box-shadow: 0 0 14px var(--cyan); position: relative; }
  .pin::after { content: ""; position: absolute; inset: -12px; border-radius: 50%; border: 1px solid var(--cyan-soft); animation: ping 1.8s ease-out infinite; }
  @keyframes ping { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }

  /* ---------- Habillage HUD ---------- */
  #grid { position: fixed; inset: 0; pointer-events: none; z-index: 400;
    background-image:
      linear-gradient(var(--cyan-faint) 1px, transparent 1px),
      linear-gradient(90deg, var(--cyan-faint) 1px, transparent 1px);
    background-size: 64px 64px; opacity: .35;
    mask-image: radial-gradient(ellipse at center, #000 40%, transparent 95%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 40%, transparent 95%); }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 401;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .75) 100%); }
  #ruler { position: fixed; top: 14px; left: 4%; right: 4%; height: 10px; z-index: 402; pointer-events: none;
    background: repeating-linear-gradient(90deg, var(--cyan-soft) 0 1px, transparent 1px 48px); opacity: .45; }
  #bracket { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 260px; height: 26px; z-index: 402; pointer-events: none;
    border-bottom: 1px solid var(--cyan-soft); clip-path: polygon(0 0, 100% 0, 88% 100%, 12% 100%);
    background: linear-gradient(180deg, rgba(73, 198, 255, .10), transparent); }
  .corner { position: fixed; width: 34px; height: 34px; z-index: 402; border-color: var(--cyan-soft); border-style: solid; pointer-events: none; }
  .corner.tl { top: 30px; left: 22px; border-width: 1px 0 0 1px; }
  .corner.tr { top: 30px; right: 22px; border-width: 1px 1px 0 0; }
  .corner.bl { bottom: 22px; left: 22px; border-width: 0 0 1px 1px; }
  .corner.br { bottom: 22px; right: 22px; border-width: 0 1px 1px 0; }

  #clock { position: fixed; top: 44px; left: 48px; z-index: 450; font-family: var(--mono); letter-spacing: .08em; }
  #clock .time { font-size: 30px; color: var(--text); text-shadow: 0 0 12px var(--cyan-soft); }
  #clock .date { font-size: 13px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  #status { position: fixed; top: 44px; right: 48px; z-index: 450; text-align: right; font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.7; }
  #status b { color: var(--cyan); font-weight: normal; }
  #status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
  #status .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  #status .dot.err { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

  /* ---------- Orbe ---------- */
  #orb { position: fixed; z-index: 500; width: 230px; height: 230px; left: 50%; top: 50%;
    transform: translate(-50%, -50%); cursor: pointer; border: 0; padding: 0; background: none; color: inherit;
    transition: left 1.2s cubic-bezier(.65, 0, .35, 1), top 1.2s cubic-bezier(.65, 0, .35, 1), width 1.2s cubic-bezier(.65, 0, .35, 1), height 1.2s cubic-bezier(.65, 0, .35, 1); }
  body.map-on #orb { left: calc(100% - 130px); top: calc(100% - 140px); width: 150px; height: 150px; }
  #orb:focus-visible { outline: 1px dashed var(--cyan); outline-offset: 10px; border-radius: 50%; }
  #orb svg { width: 100%; height: 100%; overflow: visible; }
  #orb .glow { fill: url(#core); }
  #orb .ring { fill: none; stroke: var(--cyan); transform-origin: 100px 100px; }
  #orb .r1 { stroke-width: 2.2; stroke-dasharray: 230 40 60 40; animation: spin 14s linear infinite; filter: drop-shadow(0 0 6px var(--cyan)); }
  #orb .r2 { stroke-width: 1; stroke-dasharray: 2 6; opacity: .7; animation: spin 40s linear infinite reverse; }
  #orb .r3 { stroke-width: 3; stroke-dasharray: 40 340; opacity: .9; animation: spin 6s linear infinite; }
  #orb .r4 { stroke-width: .8; opacity: .35; }
  #orb .ticks line { stroke: var(--cyan-soft); stroke-width: 1; }
  #orb .label { font-family: var(--sans); font-weight: 600; font-size: 15px; letter-spacing: .28em; fill: var(--text); text-anchor: middle; }
  #orb .pulse { fill: none; stroke: var(--cyan); stroke-width: 1.2; opacity: 0; transform-origin: 100px 100px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.06); opacity: 1; } }
  @keyframes wave { from { transform: scale(.85); opacity: .9; } to { transform: scale(1.55); opacity: 0; } }
  #orb .core-group { transform-origin: 100px 100px; animation: breathe 4s ease-in-out infinite; }
  body.listening #orb .r1 { animation-duration: 3s; }
  body.listening #orb .r3 { animation-duration: 1.4s; }
  body.listening #orb .pulse { animation: wave 1.4s ease-out infinite; }
  body.listening #orb .pulse.p2 { animation-delay: .7s; }
  body.thinking #orb .r1 { animation-duration: 1.6s; stroke-dasharray: 20 14; }
  body.thinking #orb .r3 { animation-duration: .9s; }
  body.speaking #orb .core-group { animation: breathe .5s ease-in-out infinite; }
  body.speaking #orb .pulse { animation: wave 1s ease-out infinite; }
  body.confirm #orb .ring, body.confirm #orb .pulse { stroke: var(--warn); }

  #hint { position: fixed; z-index: 450; left: 50%; top: calc(50% + 150px); transform: translateX(-50%);
    font-family: var(--mono); font-size: 13px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
    transition: opacity .8s; text-align: center; }
  body.map-on #hint, body.hint-off #hint { opacity: 0; pointer-events: none; }

  /* ---------- Carte météo ---------- */
  .leaflet-radar-pane { filter: saturate(1.25) brightness(1.1); }
  .wx-pin { display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -50%); width: 96px;
    animation: spop .6s cubic-bezier(.2, 1.5, .4, 1) both; animation-delay: var(--d); pointer-events: none; }
  .wx-pin .ic { width: 38px; height: 38px; color: var(--t); filter: drop-shadow(0 0 8px var(--t)); }
  .wx-pin b { font-family: var(--sans); font-weight: 500; font-size: 20px; color: var(--t); text-shadow: 0 0 10px var(--t), 0 1px 4px #000; line-height: 1; margin-top: -2px; }
  .wx-pin i { font-style: normal; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--text); text-transform: uppercase; text-shadow: 0 1px 4px #000; margin-top: 2px; }
  .wx-pin.focus { transform: translate(-50%, -50%) scale(1.35); z-index: 5; }
  .wx-pin.focus::before { content: ""; position: absolute; top: 2px; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--t); animation: ping 1.8s ease-out infinite; }
  .ic .ray { transform-origin: 12px 12px; animation: spin 18s linear infinite; }
  .ic .drop { animation: drop 1s linear infinite; }
  .ic .drop:nth-of-type(2) { animation-delay: .33s; } .ic .drop:nth-of-type(3) { animation-delay: .66s; }
  @keyframes drop { 0% { transform: translateY(-3px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(5px); opacity: 0; } }
  .ic .bolt { animation: blink 1.6s steps(1) infinite; }
  .ic .flake { animation: drop 2s linear infinite; }
  .ic .cloudm { animation: drift 6s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(-1px); } to { transform: translateX(1.5px); } }
  #radartag { position: fixed; z-index: 452; left: 50%; bottom: 34px; transform: translateX(-50%); font-family: var(--mono); font-size: 11px;
    letter-spacing: .2em; color: var(--cyan); opacity: 0; transition: opacity .5s; pointer-events: none; display: flex; align-items: center; gap: 10px; }
  #radartag.show { opacity: .9; }
  #radartag .bar { width: 160px; height: 3px; background: rgba(73, 198, 255, .15); }
  #radartag .bar i { display: block; height: 100%; width: 0; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
  body:not(.ui-idle) #radartag { bottom: 96px; }

  /* ---------- Schémas animés (schema.js) ---------- */
  #stage { position: fixed; z-index: 430; opacity: 0; pointer-events: none; transition: opacity .6s; }
  body.stage-on #stage { opacity: 1; pointer-events: auto; }
  body.stage-on #map { opacity: .18; }
  body.stage-on #vignette { background: radial-gradient(ellipse at center, rgba(2, 6, 12, .55) 30%, rgba(0, 0, 0, .85) 100%); }
  #stagesvg { width: 100%; height: 100%; overflow: visible; }
  .stage-x { position: absolute; top: -8px; right: -8px; background: none; border: 0; color: var(--muted); font-size: 14px; cursor: pointer; padding: 6px; }
  .stage-x:hover, .stage-x:focus-visible { color: var(--cyan); outline: none; }
  body.ui-idle .stage-x { opacity: 0; }
  body.stage-on #orb { left: calc(100% - 130px); top: calc(100% - 140px); width: 150px; height: 150px; }
  body.stage-on #hint { opacity: 0; }
  body.stage-on #activity { left: calc(100% - 130px); top: calc(100% - 52px); font-size: 10px; }
  body.stage-on #maptitle.show { opacity: 1; }
  body.stage-scan #scan { animation: scan 1.4s ease-out; }
  .s-pop { opacity: 0; animation: spop .55s cubic-bezier(.2, 1.4, .4, 1) both; transform-box: fill-box; transform-origin: center; }
  @keyframes spop { 0% { opacity: 0; transform: scale(.3); } 60% { opacity: 1; } 100% { opacity: 1; transform: scale(1); } }
  .s-box { fill: url(#s-fill); stroke: var(--c); stroke-width: 1.6; filter: drop-shadow(0 0 7px var(--c)); }
  .s-box.s-big { stroke-width: 2.4; filter: drop-shadow(0 0 16px var(--c)); }
  .s-corner { fill: none; stroke: #fff; stroke-width: 2.4; opacity: .85; }
  .s-flash { fill: var(--c); opacity: 0; animation: sflash .9s ease-out both; animation-delay: inherit; pointer-events: none; }
  .s-pop .s-flash { animation-delay: inherit; }
  @keyframes sflash { 0% { opacity: .55; } 100% { opacity: 0; } }
  .s-label { font-family: var(--sans); font-weight: 600; font-size: 17px; fill: var(--text); letter-spacing: .02em; }
  .s-label.big { font-size: 22px; letter-spacing: .08em; text-transform: uppercase; }
  .s-detail { font-family: var(--sans); font-size: 13px; fill: var(--muted); }
  .s-edge { fill: none; stroke: var(--c, var(--cyan)); stroke-width: 2; opacity: .85; filter: drop-shadow(0 0 4px var(--c, var(--cyan))); }
  .s-edge.s-arc { stroke-width: 2.6; }
  .s-arrowhead { fill: var(--cyan); }

  /* ---------- Scène 3D, vision, diagnostic ---------- */

  .rg-titre { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
  .rg-opts { display: flex; flex-wrap: wrap; gap: 8px; }

  /* Suivi du visage */
  #suivi { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 446; pointer-events: none; }
  /* Vision : vidéo en fond plein écran, miroir + filtre holographique, ligne de scan */
  #visionvideo { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: 1;
    filter: grayscale(1) sepia(1) hue-rotate(165deg) saturate(3.2) brightness(.55) contrast(1.35); opacity: 0; transition: opacity 1s; pointer-events: none; }
  body.vision-on #visionvideo { opacity: .62; }

  body.vision-on #visionfx { opacity: 1; }
  #visionfx .vx-scan { position: absolute; left: 0; right: 0; height: 120px; top: -120px;
    background: linear-gradient(180deg, transparent, rgba(73, 198, 255, .22) 85%, rgba(160, 230, 255, .7) 100%); animation: vxscan 4.5s linear infinite; }
  @keyframes vxscan { to { transform: translateY(calc(100vh + 120px)); } }
  #visionfx .vx-label { position: absolute; top: 112px; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: 12px;
    letter-spacing: .4em; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); animation: blink 1.6s steps(2) infinite; }
  body.map-on #visionfx .vx-label, body.stage-on #visionfx .vx-label { top: 132px; left: auto; right: 48px; transform: none; }
  .hand-cursor { will-change: transform; position: fixed; left: -14px; top: -14px; width: 28px; height: 28px; border-radius: 50%; z-index: 700; pointer-events: none;
    border: 2px solid var(--cyan); box-shadow: 0 0 14px var(--cyan), inset 0 0 10px rgba(73, 198, 255, .4); opacity: 0; transition: opacity .2s, width .15s, height .15s, left .15s, top .15s; }

  .hand-cursor.pince::after { inset: 4px; background: var(--warn); }
  #diagmini { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; cursor: pointer; pointer-events: auto; }
  .dg-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3a4a5a; }
  .dg-dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }

  #diag { position: fixed; z-index: 620; top: 130px; right: 48px; width: 300px; background: rgba(6, 12, 22, .95); border: 1px solid var(--cyan-faint);
    border-left: 2px solid var(--cyan); padding: 12px 14px; font-family: var(--mono); font-size: 12px; display: none; }

  @media (max-width: 760px) { #diag { right: 16px; left: 16px; width: auto; } }

  /* ---------- Mode épuré (par défaut) : aucun texte de conversation à l'écran ---------- */
  body.clean #log { display: none; }

  #activity { position: fixed; z-index: 450; left: 50%; top: calc(50% + 128px); transform: translateX(-50%);

  /* ---------- Transcription ---------- */
  #log { position: fixed; z-index: 450; left: 48px; bottom: 96px; width: min(560px, calc(100% - 300px)); display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .line { font-size: 20px; line-height: 1.35; padding-left: 14px; border-left: 2px solid var(--cyan-soft); text-shadow: 0 1px 8px #000; animation: rise .4s ease both; }
  .line.user { color: var(--muted); font-size: 16px; border-color: rgba(111, 138, 166, .5); }

  .line.error { color: var(--danger); border-color: var(--danger); font-size: 16px; }
  .line.interim { color: var(--text); opacity: .6; font-style: italic; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---------- Saisie ---------- */
  #bar { position: fixed; z-index: 460; left: 48px; bottom: 36px; width: min(560px, calc(100% - 300px)); display: flex; gap: 10px; align-items: center; }
  #input { flex: 1; background: rgba(3, 10, 20, .7); border: 1px solid var(--cyan-faint); border-bottom-color: var(--cyan-soft);
    color: var(--text); font-family: var(--sans); font-size: 17px; padding: 10px 14px; outline: none; }
  #input::placeholder { color: var(--muted); }
  #input:focus { border-color: var(--cyan-soft); box-shadow: 0 0 18px rgba(73, 198, 255, .15); }
  .btn { background: rgba(3, 10, 20, .7); border: 1px solid var(--cyan-faint); color: var(--muted); font-family: var(--mono);
    font-size: 11px; letter-spacing: .12em; padding: 12px 12px; cursor: pointer; text-transform: uppercase; white-space: nowrap; }
  .btn:hover, .btn:focus-visible { color: var(--cyan); border-color: var(--cyan-soft); outline: none; }
  .btn.active { color: var(--bg); background: var(--cyan); border-color: var(--cyan); }

  #voices { position: fixed; z-index: 470; left: 48px; bottom: 92px; width: min(560px, calc(100% - 300px)); max-height: 60vh; overflow: auto;

    display: none; }
  body.voices-open #voices { display: block; }
  body.voices-open #log { visibility: hidden; }
  #voices h3 { margin: 14px 0 6px; font-family: var(--mono); font-weight: normal; font-size: 11px; letter-spacing: .2em; color: var(--muted); }
  #voices h3:first-child { margin-top: 0; }
  .voice { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; margin: 2px 0; background: none; border: 1px solid transparent;
    color: var(--text); font-family: var(--sans); font-size: 17px; text-align: left; cursor: pointer; }
  .voice:hover, .voice:focus-visible { border-color: var(--cyan-faint); outline: none; }
  .voice.selected { border-color: var(--cyan); background: rgba(73, 198, 255, .08); }
  .voice .tag { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--cyan); border: 1px solid var(--cyan-faint); padding: 2px 6px; }
  .voice .tag.best { color: var(--ok); border-color: rgba(77, 255, 184, .35); }
  .voice .grow { flex: 1; }
  .voice .play { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .voice[disabled] { opacity: .45; cursor: default; }
  #voices .tip { margin: 14px 0 0; font-size: 14px; color: var(--muted); line-height: 1.4; }

  /* ---------- Validation ---------- */
  #confirm { position: fixed; z-index: 600; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.96); width: min(620px, calc(100% - 32px));
    background: rgba(6, 12, 22, .94); border: 1px solid var(--warn); box-shadow: 0 0 40px rgba(255, 181, 71, .18); padding: 26px 28px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
  body.confirm #confirm { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  #confirm h2 { margin: 0 0 6px; font-family: var(--mono); font-weight: normal; font-size: 12px; letter-spacing: .2em; color: var(--warn); }
  #confirm p { margin: 0 0 14px; font-size: 18px; }

    font-size: 14px; color: #ffe2b0; white-space: pre-wrap; word-break: break-all; max-height: 40vh; overflow: auto; }
  #confirm .row { display: flex; gap: 12px; justify-content: flex-end; align-items: center; }
  #confirm .row span { margin-right: auto; color: var(--muted); font-size: 14px; }
  #confirm .yes { border-color: var(--warn); color: var(--warn); }
  #confirm .yes:hover, #confirm .yes:focus-visible { background: var(--warn); color: var(--bg); }
  #confirm .no:hover, #confirm .no:focus-visible { color: var(--danger); border-color: var(--danger); }

  @media (max-width: 760px) {
    #clock { left: 22px; top: 40px; } #status { right: 22px; top: 40px; }
    #log, #bar { left: 16px; width: calc(100% - 32px); }

  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
  }
</style>
</head>
<body>
<div id="map" aria-hidden="true"></div>

<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const body = document.body;
  // Points d'accroche pour les modules (js/app.js) : voix en flux, cerveau en ligne, 3D, vision…
  const ext = window.JARVIS_EXT = window.JARVIS_EXT || {};

  // ---------- Horloge ----------
  const tick = () => {
    const d = new Date();
    $("time").textContent = d.toLocaleTimeString("fr-FR");
    $("date").textContent = d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  };
  tick(); setInterval(tick, 1000);

  // Graduations autour de l'orbe
  const ticks = $("ticks");
  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * Math.PI * 2, long = i % 5 === 0;
    const r1 = long ? 97 : 99, r2 = 103;
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", 100 + r1 * Math.cos(a)); l.setAttribute("y1", 100 + r1 * Math.sin(a));
    l.setAttribute("x2", 100 + r2 * Math.cos(a)); l.setAttribute("y2", 100 + r2 * Math.sin(a));
    ticks.appendChild(l);
  }

  // ---------- Carte ----------
  let map = null, layer = null, tiles = null, currentStyle = "sombre";
  // Fonds de carte gratuits sans clé. « sombre » : Esri Dark Gray, repli automatique sur OpenStreetMap inversé.
  const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/";

  // ---------- Carte météo ----------

  let radarLayers = [], radarTimer = null;

  // 1) Vrai radar RainViewer (gratuit, sans clé) ; 2) repli : carte des pluies calculée avec Open-Meteo.
  async function startRadar() {
    stopRadar();
    if (!map) return;
    radarPane();
    const token = {}; startRadar.token = token;
    try {
      const d = await (await fetch("https://api.rainviewer.com/public/weather-maps.json", { cache: "no-store" })).json();
      const frames = [...(d.radar?.past || []), ...(d.radar?.nowcast || [])].slice(-12);
      if (!frames.length) throw new Error("aucune image radar");
      if (startRadar.token !== token) return;
      let ok = 0, ko = 0;
      radarLayers = frames.map((f) => {
        const l = L.tileLayer(`${d.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`,
          { pane: "radar", opacity: 0, maxNativeZoom: 7, maxZoom: 19, attribution: 'Radar &copy; <a href="https://www.rainviewer.com/">RainViewer</a>' });
        l.on("tileload", () => ok++); l.on("tileerror", () => ko++);
        return l.addTo(map);
      });
      radarTick(frames, "RADAR PLUIE");
      // Si les tuiles ne se chargent pas (service limité ou bloqué), on bascule sur le modèle Open-Meteo.
      setTimeout(() => { if (startRadar.token === token && ok === 0) { console.warn("Radar RainViewer indisponible", ko); startRainModel(token); } }, 5000);
    } catch (e) {

  // Grille de précipitations Open-Meteo (heures passées + prévision) rendue en images animées sur la carte.
  async function startRainModel(token) {
    if (!map || startRadar.token !== token) return;
    stopRadar(); startRadar.token = token;
    const c = map.getCenter(), france = c.lat > 41 && c.lat < 52 && c.lng > -6 && c.lng < 10 && map.getZoom() <= 7;
    const [la0, la1, lo0, lo1] = france ? [41.2, 51.4, -5.4, 9.8] : [c.lat - 3, c.lat + 3, c.lng - 4, c.lng + 4];
    const rows = 19, cols = 22, lats = [], lons = [];
    for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
      lats.push((la1 - (r * (la1 - la0)) / (rows - 1)).toFixed(2)); lons.push((lo0 + (k * (lo1 - lo0)) / (cols - 1)).toFixed(2));
    }

      const url = "https://api.open-meteo.com/v1/forecast?hourly=precipitation&past_hours=3&forecast_hours=4&timezone=UTC&latitude=" + lats.join(",") + "&longitude=" + lons.join(",");

        ctx.putImageData(img, 0, 0);

        attribution: 'Pluie &copy; <a href="https://open-meteo.com/">Open-Meteo</a>' }).addTo(map));
      radarTick(frames, "PLUIE (MODÈLE)");
    } catch (e) { console.warn("Carte des pluies indisponible", e); }
  }

  // ---------- Minuteurs ----------
  function startTimer(sec, label) {
    const C = 2 * Math.PI * 24;
    const el = document.createElement("div"); el.className = "timer";
    el.innerHTML = `<svg viewBox="0 0 54 54"><circle class="bg" cx="27" cy="27" r="24"/><circle class="fg" cx="27" cy="27" r="24"/></svg><div><div class="v"></div><div class="l"></div></div>`;
    el.querySelector(".l").textContent = label;
    const fg = el.querySelector(".fg"); fg.style.strokeDasharray = C;
    $("timers").appendChild(el);
    const end = Date.now() + sec * 1000;
    const fmt = (s) => { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(r).padStart(2, "0"); };
    const iv = setInterval(() => {
      const left = Math.max(0, Math.round((end - Date.now()) / 1000));

      fg.style.strokeDashoffset = C * (1 - left / sec);
      if (left === 0) {

  // ---------- Journal ----------
  const log = $("log");

    log.appendChild(el);
    while (log.children.length > 6) log.firstChild.remove();

  // ---------- Voix de Jarvis ----------

  function defaultChoice() {

  async function speakServer(text, choice) {

    } finally { clearTimeout(slow); }
    if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.error || "Voix indisponible."); }

  async function speak(text, choice) {

  // ---------- Choix de la voix ----------

  function voiceItem(choice, label, tags, disabled) {

    b.appendChild(name);

  function renderVoices() {

    h("VOIX NEURONALE LOCALE");

      + "Contenu énoncé → Voix du système → Gérer les voix → Français, puis télécharge une voix « Premium » et rouvre ce panneau.";
    box.appendChild(tip);

  async function loadVoices() {

  }
  $("voicebtn").onclick = async () => {

  // ---------- API locale ----------
  let busy = false, pending = null;
  async function api(path, data) {
    const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Jarvis": "1" }, body: JSON.stringify(data || {}) });
    const json = await res.json().catch(() => ({ error: "Réponse invalide du serveur." }));

    return json;

  function applyActions(list) {
    // Panneaux d'abord : la carte se cadre ensuite dans l'espace libre.
    const first = new Set(["panel", "weather", "system", "timer"]);
    const acts = (list || []).map((a, i) => [a, i]).sort((x, y) => (first.has(y[0].type) - first.has(x[0].type)) || x[1] - y[1]).map((x) => x[0]);
    for (const a of acts) {
      try {
        if (a.type === "map") showMap(a);
        else if (a.type === "route") showRoute(a);
        else if (a.type === "style") { revealMap(); setStyle(a.style); }
        else if (a.type === "zoom") zoomMap(a.action);
        else if (a.type === "home") goHome();
        else if (a.type === "schema") showSchema(a);
        else if (a.type === "meteo_carte") showWeatherMap(a);

        else if (a.type === "system") showSystem(a.metriques);

  async function handleResult(r) {
    applyActions(r.actions);

  }
  async function send(text) {
    text = (text || "").trim();

    if (pending) return answerConfirmByVoice(text);
    // Commandes locales (ex. « ouvre la caméra ») : traitées avant l'appel à l'IA.
    if (ext.intercept && ext.intercept(text)) { addLine("user", text); return; }
    if (busy) { addLine("action", "Un instant, je termine la demande en cours…"); return; }
    addLine("user", text);
    busy = true; setState("thinking");
    try { await handleResult(ext.ask ? await ext.ask(text) : await api("/api/ask", { text })); }
    catch (e) { addLine("error", e.message); }
    finally { busy = false; if (body.classList.contains("thinking")) setState(null); }
  }

  // ---------- Validation des commandes ----------
  function openConfirm(p) {
    pending = p;
    $("confirm-expl").textContent = p.explication || "Jarvis souhaite exécuter cette commande :";
    $("confirm-cmd").textContent = p.commande;
    body.classList.add("confirm");

    $("allow").focus();
  }
  async function decide(approve) {
    if (!pending) return;

    body.classList.remove("confirm");
    addLine("action", approve ? "✓ Commande autorisée" : "✗ Commande refusée");
    try {
      const r = await api("/api/confirm", { id: p.id, approve });
      if (r.async) { setState("thinking"); return; } // Claude continue de travailler de son côté
      busy = true; setState("thinking");
      await handleResult(r);
    } catch (e) { addLine("error", e.message); }
    finally { if (busy) { busy = false; if (body.classList.contains("thinking")) setState(null); } }
  }
  function answerConfirmByVoice(text) {
    const t = text.toLowerCase();
    if (/\b(oui|vas-y|vas y|ok|d'accord|autorise|confirme|go)\b/.test(t)) return decide(true);
    if (/\b(non|annule|refuse|stop|arrête)\b/.test(t)) return decide(false);
    speak("Dites oui pour autoriser, ou non pour refuser.");
  }
  // act() : point d'entrée unique des boutons [data-act] (souris, clavier ou pincement de la main).
  const ACTS = {
    fermer: (el) => { const p = el.closest(".panel"); if (p) closeCard(p); },
    autoriser: () => decide(true),
    refuser: () => decide(false),
  };
  function act(el) {
    if (!el) return false;
    const nom = el.dataset.act;
    if (ACTS[nom]) ACTS[nom](el); else el.click();
    return true;
  }
  window.act = act;
  document.addEventListener("click", (e) => {
    const t = e.target.closest && e.target.closest("[data-act]");
    if (t && ACTS[t.dataset.act]) { e.preventDefault(); ACTS[t.dataset.act](t); }
  });

  // ---------- Reconnaissance vocale ----------

      let finalText = "", interim = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i];

      }
      const heardAll = (finalText || interim).trim();
      // Barge-in : Jarvis se tait dès que l'utilisateur parle (en ignorant l'écho de sa propre voix).
      if (ext.bargeIn && isSpeaking() && heardAll.split(/\s+/).length >= 2 && !(ext.isEcho && ext.isEcho(heardAll))) ext.bargeIn(heardAll);
      if (handsFree) {
        if (ext.canListen && !ext.canListen()) return; // n'écoute que si l'utilisateur regarde l'écran
        const heard = heardAll;
        const m = heard.match(/\b(jarvis|jarvice|djarvis)\b[\s,.!?]*(.*)/i);
        if (pending && finalText) { setInterim(""); return send(finalText); }
        if (!m) return;
        setState("listening");
        setInterim(m[2] || "…");
        if (finalText) { setInterim(""); if (m[2].trim()) send(m[2]); else speak("Oui ?"); }
        return;

    };

  $("handsfree").onclick = () => {

  }, 600);

  $("orb").onclick = toggleListen;
  document.addEventListener("keyup", (e) => { if (pending && e.code === "Space") e.preventDefault(); });

  const input = $("input");

    if (e.key === "Escape") input.blur();

  // ---------- Widgets permanents ----------

  // ---------- Statut et cerveau ----------
  let brain = "local", localModel = "";
  function showBrain(st) {

  }
  let autonomy = "proprietaire", speed = "equilibre";
  const SPEEDS = { rapide: "Rapide", equilibre: "Équilibré", puissant: "Puissant" };
  $("speedbtn").onclick = async () => {
    const order = ["rapide", "equilibre", "puissant"];
    try {
      const st = await api("/api/settings", { vitesse: order[(order.indexOf(speed) + 1) % 3] });
      showBrain(st);
      speak({ rapide: "Mode rapide.", equilibre: "Mode équilibré.", puissant: "Mode puissant : plus lent, mais plus réfléchi." }[st.vitesse]);
    } catch (e) { addLine("error", e.message); }
  };
  $("autobtn").onclick = async () => {
    try {
      const st = await api("/api/settings", { autonomie: autonomy === "proprietaire" ? "prudent" : "proprietaire" });
      showBrain(st);
      speak(st.autonomie === "proprietaire" ? "Mode propriétaire. J'agis directement, sauf pour les actions sensibles."
                                            : "Mode prudent. Je vous demanderai avant chaque commande.");
    } catch (e) { addLine("error", e.message); }
  };
  // Mise à jour automatique : si l'interface change sur le disque (git pull), la page se recharge d'elle-même.
  let versionChargee = null;
  setInterval(() => {
    fetch("/api/status", { cache: "no-store" }).then((r) => r.json()).then((s) => {
      if (versionChargee && s.version && s.version !== versionChargee && !busy && !pending) location.reload();
    }).catch(() => {});
  }, 15000);
  fetch("/api/status").then((r) => r.json()).then((s) => {
    versionChargee = s.version || null;
    showBrain(s); $("srv").textContent = "Système en ligne"; $("srvdot").className = "dot on";
    if (s.reveil) setTimeout(onWake, 600); // fenêtre ouverte par « Hey Jarvis »
  }).catch(() => { $("srv").textContent = "Serveur injoignable"; $("srvdot").className = "dot err"; });
  $("brainbtn").onclick = async () => {
    try {
      const st = await api("/api/settings", { cerveau: brain === "claude" ? "local" : "claude" });
      if (st.cerveau === "claude" && !st.claude) addLine("error", "Claude Code n'est pas encore installé sur ce Mac : voir le guide (README).");
      showBrain(st);
      addLine("action", st.cerveau === "claude" ? "Cerveau : Claude (via ton abonnement Claude)" : `Cerveau : modèle local ${localModel}`);
    } catch (e) { addLine("error", e.message); }
  };

  // ---------- « Hey Jarvis » (réveil par le programme d'écoute) ----------
  function chime() {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      [660, 990].forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = f; o.type = "sine";
        g.gain.setValueAtTime(0.0001, ac.currentTime + i * 0.12);
        g.gain.exponentialRampToValueAtTime(0.18, ac.currentTime + i * 0.12 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + i * 0.12 + 0.25);
        o.connect(g).connect(ac.destination); o.start(ac.currentTime + i * 0.12); o.stop(ac.currentTime + i * 0.12 + 0.3);
      });
    } catch (_) { /* son indisponible */ }
  }
  function onWake() {
    if (pending || busy) return;
    stopSpeaking(); chime(); body.classList.add("hint-off");
    if (handsFree) { setState("listening"); return; }
    setTimeout(() => { if (!recActive) startRec(); }, 350);
  }

  // ---------- Événements en direct (actions de Claude pendant qu'il travaille) ----------
  const ACTIVITY = { telephone: "Demande depuis l'iPhone…", executer_commande: "Action en cours…", WebSearch: "Recherche sur le web…", WebFetch: "Lecture d'une page web…", Read: "Lecture d'un fichier…",
    Glob: "Recherche de fichiers…", Grep: "Recherche dans les fichiers…" };
  let lastEvent = null;
  function handleEvent(e) {
        if (e.type === "actions") applyActions(e.actions);
        else if (e.type === "pending") openConfirm(e.pending);
        else if (e.type === "pending_closed" && pending && pending.id === e.id) { pending = null; body.classList.remove("confirm"); }
        else if (e.type === "wake") onWake();
        else if (ext.event && ext.event(e)) { /* géré par les modules */ }
        else if (e.type === "activity" && ACTIVITY[e.outil]) { activity(ACTIVITY[e.outil]); addLine("action", "▸ " + ACTIVITY[e.outil]); }
  }
  async function pollEvents() {
    try {
      const r = await (await fetch("/api/events?after=" + (lastEvent ?? 0))).json();
      if (lastEvent === null) { lastEvent = r.last; return; } // ignore l'historique au démarrage
      for (const e of r.events) { lastEvent = Math.max(lastEvent, e.id); handleEvent(e); }
    } catch (_) { /* serveur momentanément indisponible */ }
  }
  // Flux continu (Server-Sent Events) : aucun délai ; repli sur l'interrogation régulière si indisponible.
  let flux = null;
  if (window.EventSource) {
    flux = new EventSource("/api/events/stream");
    flux.onmessage = (m) => { try { handleEvent(JSON.parse(m.data)); } catch (_) {} };
    flux.onerror = () => { if (ext.mode === "cloud" || flux.readyState === 2) { flux.close(); flux = null; } };
  }
  (function loopEvents() {
    const cloud = ext.mode === "cloud";
    if (!cloud && !flux) pollEvents();
    setTimeout(loopEvents, cloud ? 2000 : busy ? 150 : 600);
  })();
  if (!SR) $("micmode").textContent = "indisponible (Chrome/Safari)";
  // API du cœur pour les modules
  window.JARVIS = {
    $, body, store, api, act, ACTS, card, layoutPanels, closeCard, applyActions, loadWidgets, handleResult, send, speak, stopSpeaking, setState, addLine, toast, activity,
    openConfirm, decide, startRec, toggleListen, currentChoice, showWeatherMap, goHome, zoomMap, setTitle, revealMap,
    get map() { return map; }, get pending() { return pending; }, get busy() { return busy; },
    get recActive() { return recActive; }, get handsFree() { return handsFree; }, get voiceOn() { return voiceOn; },
    setHandsFree(v) { if (!rec || handsFree === v) return; handsFree = v; updateHandsFree(); if (recActive) rec.stop(); else if (v) startRec(); },
    stopRec() { if (rec && recActive) rec.abort(); },
  };
})();
</script>
</body>
