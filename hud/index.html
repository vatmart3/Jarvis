<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #03060c;
    --cyan: #49c6ff;
    --cyan-soft: rgba(73, 198, 255, .55);
    --cyan-faint: rgba(73, 198, 255, .14);
    --text: #cfe9ff;
    --muted: #6f8aa6;
    --warn: #ffb547;
    --danger: #ff5d6c;
    --ok: #4dffb8;
    --mono: "Share Tech Mono", ui-monospace, monospace;
    --sans: "Rajdhani", "Avenir Next", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }

  /* ---------- Carte ---------- */
  #map { position: fixed; inset: 0; background: var(--bg); opacity: 0; transition: opacity 1.6s ease; }
  body.map-on #map { opacity: 1; }
  .leaflet-tile-pane { filter: invert(0) sepia(1) hue-rotate(170deg) saturate(3.2) brightness(.82) contrast(1.15); }
  .leaflet-container { background: var(--bg); font-family: var(--sans); }
  .leaflet-control-attribution { background: rgba(3, 6, 12, .6) !important; color: var(--muted) !important; font-size: 10px; }
  .leaflet-control-attribution a { color: var(--muted) !important; }
  .pin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--cyan); box-shadow: 0 0 14px var(--cyan); position: relative; }
  .pin::after { content: ""; position: absolute; inset: -12px; border-radius: 50%; border: 1px solid var(--cyan-soft); animation: ping 1.8s ease-out infinite; }
  @keyframes ping { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }

  /* ---------- Habillage HUD ---------- */
  #grid { position: fixed; inset: 0; pointer-events: none; z-index: 400;
    background-image:
      linear-gradient(var(--cyan-faint) 1px, transparent 1px),
      linear-gradient(90deg, var(--cyan-faint) 1px, transparent 1px);
    background-size: 64px 64px; opacity: .35;
    mask-image: radial-gradient(ellipse at center, #000 40%, transparent 95%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 40%, transparent 95%); }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 401;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .75) 100%); }
  #ruler { position: fixed; top: 14px; left: 4%; right: 4%; height: 10px; z-index: 402; pointer-events: none;
    background: repeating-linear-gradient(90deg, var(--cyan-soft) 0 1px, transparent 1px 48px); opacity: .45; }
  #bracket { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 260px; height: 26px; z-index: 402; pointer-events: none;
    border-bottom: 1px solid var(--cyan-soft); clip-path: polygon(0 0, 100% 0, 88% 100%, 12% 100%);
    background: linear-gradient(180deg, rgba(73, 198, 255, .10), transparent); }
  .corner { position: fixed; width: 34px; height: 34px; z-index: 402; border-color: var(--cyan-soft); border-style: solid; pointer-events: none; }
  .corner.tl { top: 30px; left: 22px; border-width: 1px 0 0 1px; }
  .corner.tr { top: 30px; right: 22px; border-width: 1px 1px 0 0; }
  .corner.bl { bottom: 22px; left: 22px; border-width: 0 0 1px 1px; }
  .corner.br { bottom: 22px; right: 22px; border-width: 0 1px 1px 0; }

  #clock { position: fixed; top: 44px; left: 48px; z-index: 450; font-family: var(--mono); letter-spacing: .08em; }
  #clock .time { font-size: 30px; color: var(--text); text-shadow: 0 0 12px var(--cyan-soft); }
  #clock .date { font-size: 13px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  #status { position: fixed; top: 44px; right: 48px; z-index: 450; text-align: right; font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.7; }
  #status b { color: var(--cyan); font-weight: normal; }
  #status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
  #status .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  #status .dot.err { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

  /* ---------- Orbe ---------- */
  #orb { position: fixed; z-index: 500; width: 230px; height: 230px; left: 50%; top: 50%;
    transform: translate(-50%, -50%); cursor: pointer; border: 0; padding: 0; background: none; color: inherit;
    transition: left 1.2s cubic-bezier(.65, 0, .35, 1), top 1.2s cubic-bezier(.65, 0, .35, 1), width 1.2s cubic-bezier(.65, 0, .35, 1), height 1.2s cubic-bezier(.65, 0, .35, 1); }
  body.map-on #orb { left: calc(100% - 130px); top: calc(100% - 140px); width: 150px; height: 150px; }
  #orb:focus-visible { outline: 1px dashed var(--cyan); outline-offset: 10px; border-radius: 50%; }
  #orb svg { width: 100%; height: 100%; overflow: visible; }
  #orb .glow { fill: url(#core); }
  #orb .ring { fill: none; stroke: var(--cyan); transform-origin: 100px 100px; }
  #orb .r1 { stroke-width: 2.2; stroke-dasharray: 230 40 60 40; animation: spin 14s linear infinite; filter: drop-shadow(0 0 6px var(--cyan)); }
  #orb .r2 { stroke-width: 1; stroke-dasharray: 2 6; opacity: .7; animation: spin 40s linear infinite reverse; }
  #orb .r3 { stroke-width: 3; stroke-dasharray: 40 340; opacity: .9; animation: spin 6s linear infinite; }
  #orb .r4 { stroke-width: .8; opacity: .35; }
  #orb .ticks line { stroke: var(--cyan-soft); stroke-width: 1; }
  #orb .label { font-family: var(--sans); font-weight: 600; font-size: 15px; letter-spacing: .28em; fill: var(--text); text-anchor: middle; }
  #orb .pulse { fill: none; stroke: var(--cyan); stroke-width: 1.2; opacity: 0; transform-origin: 100px 100px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.06); opacity: 1; } }
  @keyframes wave { from { transform: scale(.85); opacity: .9; } to { transform: scale(1.55); opacity: 0; } }
  #orb .core-group { transform-origin: 100px 100px; animation: breathe 4s ease-in-out infinite; }
  body.listening #orb .r1 { animation-duration: 3s; }
  body.listening #orb .r3 { animation-duration: 1.4s; }
  body.listening #orb .pulse { animation: wave 1.4s ease-out infinite; }
  body.listening #orb .pulse.p2 { animation-delay: .7s; }
  body.thinking #orb .r1 { animation-duration: 1.6s; stroke-dasharray: 20 14; }
  body.thinking #orb .r3 { animation-duration: .9s; }
  body.speaking #orb .core-group { animation: breathe .5s ease-in-out infinite; }
  body.speaking #orb .pulse { animation: wave 1s ease-out infinite; }
  body.confirm #orb .ring, body.confirm #orb .pulse { stroke: var(--warn); }

  #hint { position: fixed; z-index: 450; left: 50%; top: calc(50% + 150px); transform: translateX(-50%);
    font-family: var(--mono); font-size: 13px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
    transition: opacity .8s; text-align: center; }
  body.map-on #hint { opacity: 0; pointer-events: none; }

  /* ---------- Transcription ---------- */
  #log { position: fixed; z-index: 450; left: 48px; bottom: 96px; width: min(560px, calc(100% - 300px)); display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .line { font-size: 20px; line-height: 1.35; padding-left: 14px; border-left: 2px solid var(--cyan-soft); text-shadow: 0 1px 8px #000; animation: rise .4s ease both; }
  .line.user { color: var(--muted); font-size: 16px; border-color: rgba(111, 138, 166, .5); }
  .line.user::before { content: "VOUS  "; font-family: var(--mono); font-size: 11px; letter-spacing: .15em; }
  .line.jarvis::before { content: "JARVIS  "; font-family: var(--mono); font-size: 11px; letter-spacing: .15em; color: var(--cyan); }
  .line.action { font-family: var(--mono); font-size: 12px; color: var(--cyan); border-color: transparent; opacity: .85; white-space: pre-wrap; max-height: 9em; overflow: hidden; }
  .line.error { color: var(--danger); border-color: var(--danger); font-size: 16px; }
  .line.interim { color: var(--text); opacity: .6; font-style: italic; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---------- Saisie ---------- */
  #bar { position: fixed; z-index: 460; left: 48px; bottom: 36px; width: min(560px, calc(100% - 300px)); display: flex; gap: 10px; align-items: center; }
  #input { flex: 1; background: rgba(3, 10, 20, .7); border: 1px solid var(--cyan-faint); border-bottom-color: var(--cyan-soft);
    color: var(--text); font-family: var(--sans); font-size: 17px; padding: 10px 14px; outline: none; }
  #input::placeholder { color: var(--muted); }
  #input:focus { border-color: var(--cyan-soft); box-shadow: 0 0 18px rgba(73, 198, 255, .15); }
  .btn { background: rgba(3, 10, 20, .7); border: 1px solid var(--cyan-faint); color: var(--muted); font-family: var(--mono);
    font-size: 11px; letter-spacing: .12em; padding: 12px 12px; cursor: pointer; text-transform: uppercase; white-space: nowrap; }
  .btn:hover, .btn:focus-visible { color: var(--cyan); border-color: var(--cyan-soft); outline: none; }
  .btn.active { color: var(--bg); background: var(--cyan); border-color: var(--cyan); }

  /* ---------- Choix de la voix ---------- */
  #voices { position: fixed; z-index: 470; left: 48px; bottom: 92px; width: min(560px, calc(100% - 300px)); max-height: 60vh; overflow: auto;
    background: rgba(6, 12, 22, .96); border: 1px solid var(--cyan-soft); box-shadow: 0 0 30px rgba(73, 198, 255, .12); padding: 16px 18px;
    display: none; }
  body.voices-open #voices { display: block; }
  body.voices-open #log { visibility: hidden; }
  #voices h3 { margin: 14px 0 6px; font-family: var(--mono); font-weight: normal; font-size: 11px; letter-spacing: .2em; color: var(--muted); }
  #voices h3:first-child { margin-top: 0; }
  .voice { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; margin: 2px 0; background: none; border: 1px solid transparent;
    color: var(--text); font-family: var(--sans); font-size: 17px; text-align: left; cursor: pointer; }
  .voice:hover, .voice:focus-visible { border-color: var(--cyan-faint); outline: none; }
  .voice.selected { border-color: var(--cyan); background: rgba(73, 198, 255, .08); }
  .voice .tag { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--cyan); border: 1px solid var(--cyan-faint); padding: 2px 6px; }
  .voice .tag.best { color: var(--ok); border-color: rgba(77, 255, 184, .35); }
  .voice .grow { flex: 1; }
  .voice .play { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .voice[disabled] { opacity: .45; cursor: default; }
  #voices .tip { margin: 14px 0 0; font-size: 14px; color: var(--muted); line-height: 1.4; }

  /* ---------- Validation ---------- */
  #confirm { position: fixed; z-index: 600; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.96); width: min(620px, calc(100% - 32px));
    background: rgba(6, 12, 22, .94); border: 1px solid var(--warn); box-shadow: 0 0 40px rgba(255, 181, 71, .18); padding: 26px 28px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
  body.confirm #confirm { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  #confirm h2 { margin: 0 0 6px; font-family: var(--mono); font-weight: normal; font-size: 12px; letter-spacing: .2em; color: var(--warn); }
  #confirm p { margin: 0 0 14px; font-size: 18px; }
  #confirm pre { margin: 0 0 20px; padding: 12px 14px; background: #000; border-left: 2px solid var(--warn); font-family: var(--mono);
    font-size: 14px; color: #ffe2b0; white-space: pre-wrap; word-break: break-all; max-height: 40vh; overflow: auto; }
  #confirm .row { display: flex; gap: 12px; justify-content: flex-end; align-items: center; }
  #confirm .row span { margin-right: auto; color: var(--muted); font-size: 14px; }
  #confirm .yes { border-color: var(--warn); color: var(--warn); }
  #confirm .yes:hover, #confirm .yes:focus-visible { background: var(--warn); color: var(--bg); }
  #confirm .no:hover, #confirm .no:focus-visible { color: var(--danger); border-color: var(--danger); }

  @media (max-width: 760px) {
    #clock { left: 22px; top: 40px; } #status { right: 22px; top: 40px; }
    #log, #bar { left: 16px; width: calc(100% - 32px); }
    #log { bottom: 90px; } #bar { bottom: 24px; }
    body.map-on #orb { left: calc(100% - 70px); top: 120px; width: 96px; height: 96px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
  }
</style>
</head>
<body>
<div id="map" aria-hidden="true"></div>
<div id="grid"></div>
<div id="vignette"></div>
<div id="ruler"></div>
<div id="bracket"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

<div id="clock"><div class="time" id="time">--:--:--</div><div class="date" id="date"></div></div>
<div id="status">
  <div><span class="dot" id="srvdot"></span><span id="srv">Connexion…</span></div>
  <div>Modèle <b id="model">—</b></div>
  <div>Micro <b id="micmode">appuyer pour parler</b></div>
</div>

<button id="orb" aria-label="Parler à Jarvis (barre d'espace)">
  <svg viewBox="0 0 200 200" aria-hidden="true">
    <defs>
      <radialGradient id="core" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#0b2236"/>
        <stop offset="62%" stop-color="#071422"/>
        <stop offset="86%" stop-color="rgba(73,198,255,.45)"/>
        <stop offset="100%" stop-color="rgba(73,198,255,0)"/>
      </radialGradient>
    </defs>
    <circle class="pulse" cx="100" cy="100" r="62"/>
    <circle class="pulse p2" cx="100" cy="100" r="62"/>
    <g class="ticks" id="ticks"></g>
    <circle class="ring r4" cx="100" cy="100" r="94"/>
    <circle class="ring r2" cx="100" cy="100" r="84"/>
    <circle class="ring r3" cx="100" cy="100" r="74"/>
    <g class="core-group">
      <circle class="glow" cx="100" cy="100" r="64"/>
      <circle class="ring r1" cx="100" cy="100" r="58"/>
      <circle cx="100" cy="100" r="44" fill="none" stroke="rgba(207,233,255,.85)" stroke-width="1.4"/>
      <text class="label" x="100" y="105">JARVIS</text>
    </g>
  </svg>
</button>
<div id="hint">Clique sur l'orbe ou appuie sur Espace pour parler</div>

<div id="log" aria-live="polite"></div>

<div id="bar">
  <input id="input" type="text" placeholder="Écris à Jarvis…  (touche /)" autocomplete="off" aria-label="Message pour Jarvis">
  <button class="btn" id="handsfree" title="Écoute permanente : dis « Jarvis » puis ta demande">Mains libres</button>
  <button class="btn" id="voicebtn" title="Choisir la voix de Jarvis">Voix</button>
  <button class="btn" id="mute" title="Couper ou rétablir la voix de Jarvis">Son on</button>
</div>
<div id="voices" role="dialog" aria-label="Choisir la voix de Jarvis"></div>

<div id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
  <h2 id="confirm-title">AUTORISATION REQUISE</h2>
  <p id="confirm-expl"></p>
  <pre id="confirm-cmd"></pre>
  <div class="row">
    <span>Dis « oui » ou « non »</span>
    <button class="btn no" id="deny">Refuser (Échap)</button>
    <button class="btn yes" id="allow">Autoriser (Entrée)</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const body = document.body;

  // ---------- Horloge ----------
  const tick = () => {
    const d = new Date();
    $("time").textContent = d.toLocaleTimeString("fr-FR");
    $("date").textContent = d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  };
  tick(); setInterval(tick, 1000);

  // Graduations autour de l'orbe
  const ticks = $("ticks");
  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * Math.PI * 2, long = i % 5 === 0;
    const r1 = long ? 97 : 99, r2 = 103;
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", 100 + r1 * Math.cos(a)); l.setAttribute("y1", 100 + r1 * Math.sin(a));
    l.setAttribute("x2", 100 + r2 * Math.cos(a)); l.setAttribute("y2", 100 + r2 * Math.sin(a));
    ticks.appendChild(l);
  }

  // ---------- Carte ----------
  let map = null, marker = null;
  try {
    map = L.map("map", { zoomControl: false, attributionControl: true, worldCopyJump: true }).setView([46.6, 2.4], 6);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      maxZoom: 19, subdomains: "abcd",
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    }).addTo(map);
  } catch (e) { console.warn("Carte indisponible", e); }

  async function showPlace(query) {
    if (!map || !query) return false;
    try {
      const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=fr&q=" + encodeURIComponent(query);
      const res = await fetch(url, { headers: { "Accept": "application/json" } });
      const [hit] = await res.json();
      if (!hit) { addLine("error", `Lieu introuvable : ${query}`); return false; }
      body.classList.add("map-on");
      setTimeout(() => map.invalidateSize(), 50);
      const [s, n, w, e] = hit.boundingbox.map(Number);
      map.flyToBounds([[s, w], [n, e]], { duration: 3.2, maxZoom: 13, padding: [80, 80] });
      if (marker) marker.remove();
      marker = L.marker([+hit.lat, +hit.lon], { icon: L.divIcon({ className: "", html: '<div class="pin"></div>', iconSize: [18, 18] }) }).addTo(map);
      return true;
    } catch (e) { addLine("error", "Recherche du lieu impossible (connexion internet ?)."); return false; }
  }

  // ---------- Journal ----------
  const log = $("log");
  let interimEl = null;
  function addLine(kind, text) {
    const el = document.createElement("div");
    el.className = "line " + kind;
    el.textContent = text;
    log.appendChild(el);
    while (log.children.length > 6) log.firstChild.remove();
    return el;
  }
  function setInterim(text) {
    if (!text) { if (interimEl) interimEl.remove(); interimEl = null; return; }
    if (!interimEl) interimEl = addLine("interim", "");
    interimEl.textContent = text;
  }
  const setState = (s) => {
    body.classList.remove("listening", "thinking", "speaking");
    if (s) body.classList.add(s);
  };

  // ---------- Voix de Jarvis ----------
  let voiceOn = true, speakingNow = false;
  const synth = window.speechSynthesis;
  const player = new Audio();
  let catalog = { kokoro: false, say: [] };
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) { /* stockage indisponible */ } },
  };
  let voiceChoice = store.get("jarvis.voice");
  const QUALITY = /premium|enhanced|amélior|neural|natural/i;
  const frBrowser = () => (synth ? synth.getVoices() : []).filter((v) => /^fr/i.test(v.lang));
  const frSay = () => catalog.say.filter((v) => /^fr/i.test(v.lang));

  function defaultChoice() {
    if (catalog.kokoro) return { engine: "kokoro", voice: "ff_siwis" };
    const say = frSay(), br = frBrowser();
    const pick = say.find((v) => QUALITY.test(v.name));
    if (pick) return { engine: "say", voice: pick.name };
    const g = br.find((v) => /google/i.test(v.name)) || br.find((v) => QUALITY.test(v.name));
    if (g) return { engine: "browser", voice: g.name };
    if (br[0]) return { engine: "browser", voice: br[0].name };
    if (say[0]) return { engine: "say", voice: say[0].name };
    return { engine: "browser", voice: "" };
  }
  const currentChoice = () => voiceChoice || defaultChoice();

  function stopSpeaking() {
    if (synth) synth.cancel();
    player.pause(); player.removeAttribute("src");
  }
  function speakBrowser(text, voiceName) {
    return new Promise((resolve) => {
      if (!synth) return resolve();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "fr-FR";
      const v = (synth.getVoices() || []).find((x) => x.name === voiceName) || frBrowser()[0];
      if (v) u.voice = v;
      u.rate = 1.0;
      u.onend = u.onerror = () => resolve();
      synth.speak(u);
    });
  }
  async function speakServer(text, choice) {
    const slow = setTimeout(() => addLine("action", "Chargement de la voix… (la première fois peut prendre une minute)"), 2500);
    let res;
    try {
      res = await fetch("/api/tts", { method: "POST", headers: { "Content-Type": "application/json", "X-Jarvis": "1" },
        body: JSON.stringify({ engine: choice.engine, voice: choice.voice, text }) });
    } finally { clearTimeout(slow); }
    if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.error || "Voix indisponible."); }
    const url = URL.createObjectURL(await res.blob());
    await new Promise((resolve) => {
      player.onended = player.onerror = player.onpause = () => resolve();
      player.src = url;
      player.play().catch(() => resolve());
    });
    URL.revokeObjectURL(url);
  }
  async function speak(text, choice) {
    if (!voiceOn || !text) return;
    choice = choice || currentChoice();
    stopSpeaking();
    speakingNow = true; setState("speaking");
    try {
      if (choice.engine === "browser") await speakBrowser(text, choice.voice);
      else await speakServer(text, choice);
    } catch (e) {
      addLine("error", e.message);
      await speakBrowser(text, "");
    } finally {
      speakingNow = false;
      if (body.classList.contains("speaking")) setState(null);
    }
  }
  $("mute").onclick = () => {
    voiceOn = !voiceOn;
    $("mute").textContent = voiceOn ? "Son on" : "Son off";
    $("mute").classList.toggle("active", !voiceOn);
    if (!voiceOn) stopSpeaking();
  };

  // ---------- Choix de la voix ----------
  const SAMPLE = "Bonjour monsieur. Tous les systèmes sont opérationnels. Que puis-je faire pour vous ?";
  const same = (a, b) => a && b && a.engine === b.engine && a.voice === b.voice;
  function voiceItem(choice, label, tags, disabled) {
    const b = document.createElement("button");
    b.className = "voice" + (same(choice, currentChoice()) ? " selected" : "");
    b.disabled = !!disabled;
    const name = document.createElement("span"); name.className = "grow"; name.textContent = label;
    b.appendChild(name);
    for (const [t, best] of tags) { const g = document.createElement("span"); g.className = "tag" + (best ? " best" : ""); g.textContent = t; b.appendChild(g); }
    const play = document.createElement("span"); play.className = "play"; play.textContent = disabled ? "" : "▶ écouter";
    b.appendChild(play);
    if (!disabled) b.onclick = () => { voiceChoice = choice; store.set("jarvis.voice", choice); renderVoices(); speak(SAMPLE, choice); };
    return b;
  }
  function renderVoices() {
    const box = $("voices"); box.textContent = "";
    const h = (t) => { const e = document.createElement("h3"); e.textContent = t; box.appendChild(e); };
    h("VOIX NEURONALE LOCALE");
    box.appendChild(voiceItem({ engine: "kokoro", voice: "ff_siwis" }, catalog.kokoro ? "Siwis" : "Siwis — non installée",
      [["NEURONALE", true], ["FÉMININE", false]], !catalog.kokoro));
    const say = frSay();
    if (say.length) {
      h("VOIX MACOS");
      say.sort((a, b) => QUALITY.test(b.name) - QUALITY.test(a.name)).forEach((v) =>
        box.appendChild(voiceItem({ engine: "say", voice: v.name }, v.name, QUALITY.test(v.name) ? [["PREMIUM", true]] : [], false)));
    }
    const br = frBrowser();
    if (br.length) {
      h("VOIX DU NAVIGATEUR");
      br.forEach((v) => box.appendChild(voiceItem({ engine: "browser", voice: v.name }, v.name,
        /google/i.test(v.name) ? [["EN LIGNE", false]] : QUALITY.test(v.name) ? [["PREMIUM", true]] : [], false)));
    }
    const tip = document.createElement("p"); tip.className = "tip";
    tip.textContent = "Clique sur une voix pour l'écouter et la choisir. Voix plus naturelles gratuites : Réglages Système → Accessibilité → "
      + "Contenu énoncé → Voix du système → Gérer les voix → Français, puis télécharge une voix « Premium » et rouvre ce panneau.";
    box.appendChild(tip);
  }
  async function loadVoices() {
    try { catalog = await (await fetch("/api/voices")).json(); } catch (_) { /* serveur indisponible */ }
  }
  $("voicebtn").onclick = async () => {
    const open = !body.classList.contains("voices-open");
    body.classList.toggle("voices-open", open);
    $("voicebtn").classList.toggle("active", open);
    if (open) { await loadVoices(); renderVoices(); }
  };
  loadVoices();
  if (synth) synth.onvoiceschanged = () => { if (body.classList.contains("voices-open")) renderVoices(); };

  // ---------- API locale ----------
  let busy = false, pending = null;
  async function api(path, data) {
    const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Jarvis": "1" }, body: JSON.stringify(data || {}) });
    const json = await res.json().catch(() => ({ error: "Réponse invalide du serveur." }));
    if (!res.ok || json.error) throw new Error(json.error || `Erreur ${res.status}`);
    return json;
  }
  async function handleResult(r) {
    for (const a of r.actions || []) {
      if (a.type === "map") showPlace(a.lieu);
      else if (a.type === "tool") addLine("action", "▸ " + a.result);
      else if (a.type === "shell") addLine("action", "$ " + a.commande + "\n" + a.result);
    }
    if (r.pending) return openConfirm(r.pending);
    if (r.reply) { addLine("jarvis", r.reply); await speak(r.reply); }
  }
  async function send(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    if (pending) return answerConfirmByVoice(text);
    addLine("user", text);
    busy = true; setState("thinking");
    try { await handleResult(await api("/api/ask", { text })); }
    catch (e) { addLine("error", e.message); }
    finally { busy = false; if (body.classList.contains("thinking")) setState(null); }
  }

  // ---------- Validation des commandes ----------
  function openConfirm(p) {
    pending = p;
    $("confirm-expl").textContent = p.explication || "Jarvis souhaite exécuter cette commande :";
    $("confirm-cmd").textContent = p.commande;
    body.classList.add("confirm");
    setState(null);
    speak("J'ai besoin de votre autorisation pour exécuter une commande. " + (p.explication || ""));
    $("allow").focus();
  }
  async function decide(approve) {
    if (!pending) return;
    const p = pending; pending = null;
    body.classList.remove("confirm");
    addLine("action", approve ? "✓ Commande autorisée" : "✗ Commande refusée");
    busy = true; setState("thinking");
    try { await handleResult(await api("/api/confirm", { id: p.id, approve })); }
    catch (e) { addLine("error", e.message); }
    finally { busy = false; if (body.classList.contains("thinking")) setState(null); }
  }
  function answerConfirmByVoice(text) {
    const t = text.toLowerCase();
    if (/\b(oui|vas-y|vas y|ok|d'accord|autorise|confirme|go)\b/.test(t)) return decide(true);
    if (/\b(non|annule|refuse|stop|arrête)\b/.test(t)) return decide(false);
    speak("Dites oui pour autoriser, ou non pour refuser.");
  }
  $("allow").onclick = () => decide(true);
  $("deny").onclick = () => decide(false);

  // ---------- Reconnaissance vocale ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, recActive = false, handsFree = false;
  if (SR) {
    rec = new SR();
    rec.lang = "fr-FR"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    rec.onstart = () => { recActive = true; if (!handsFree) setState("listening"); };
    rec.onresult = (ev) => {
      let finalText = "", interim = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i];
        if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
      }
      if (handsFree) {
        const heard = (finalText || interim).trim();
        const m = heard.match(/\b(jarvis|jarvice|djarvis)\b[\s,.!?]*(.*)/i);
        if (pending && finalText) { setInterim(""); return send(finalText); }
        if (!m) return;
        setState("listening");
        setInterim(m[2] || "…");
        if (finalText) { setInterim(""); if (m[2].trim()) send(m[2]); else speak("Oui ?"); }
        return;
      }
      setInterim(interim);
      if (finalText) { setInterim(""); send(finalText); }
    };
    rec.onerror = (ev) => {
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
        addLine("error", "Micro refusé : autorise le micro pour cette page (icône à gauche de l'adresse).");
        handsFree = false; updateHandsFree();
      } else if (ev.error === "network") {
        addLine("error", "La reconnaissance vocale du navigateur a besoin d'internet.");
      }
    };
    rec.onend = () => {
      recActive = false; setInterim("");
      if (body.classList.contains("listening")) setState(null);
      if (handsFree) setTimeout(() => { if (handsFree && !recActive && !speakingNow) startRec(); }, 250);
    };
  }
  function startRec() {
    if (!rec || recActive) return;
    if (speakingNow) stopSpeaking();
    rec.continuous = handsFree;
    try { rec.start(); } catch (_) { /* déjà démarré */ }
  }
  function toggleListen() {
    if (!rec) { addLine("error", "Reconnaissance vocale indisponible : utilise Google Chrome ou Safari."); $("input").focus(); return; }
    if (handsFree) return;
    if (recActive) rec.stop(); else startRec();
  }
  function updateHandsFree() {
    $("handsfree").classList.toggle("active", handsFree);
    $("micmode").textContent = handsFree ? "écoute « Jarvis… »" : "appuyer pour parler";
  }
  $("handsfree").onclick = () => {
    if (!rec) return toggleListen();
    handsFree = !handsFree; updateHandsFree();
    if (recActive) rec.stop(); else if (handsFree) startRec();
    if (handsFree) addLine("action", "Mains libres : dis « Jarvis » suivi de ta demande.");
  };
  // En mains libres, on coupe le micro pendant que Jarvis parle (évite qu'il s'entende).
  setInterval(() => {
    if (!handsFree || !rec) return;
    if (speakingNow && recActive) rec.abort();
    else if (!speakingNow && !recActive && !busy) startRec();
  }, 600);

  $("orb").onclick = toggleListen;
  document.addEventListener("keyup", (e) => { if (pending && e.code === "Space") e.preventDefault(); });

  // ---------- Clavier ----------
  const input = $("input");
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); const v = input.value; input.value = ""; send(v); }
    if (e.key === "Escape") input.blur();
  });
  document.addEventListener("keydown", (e) => {
    if (pending) {
      if (e.key === "Escape") { e.preventDefault(); decide(false); }
      if (e.code === "Space") e.preventDefault(); // la barre d'espace ne doit jamais valider une commande
      return;
    }
    if (document.activeElement === input) return;
    if (e.code === "Space") { e.preventDefault(); toggleListen(); }
    else if (e.key === "/") { e.preventDefault(); input.focus(); }
    else if (e.key === "Escape") {
      if (body.classList.contains("voices-open")) $("voicebtn").click(); else stopSpeaking();
    }
  });

  // ---------- Statut ----------
  fetch("/api/status").then((r) => r.json()).then((s) => {
    $("model").textContent = s.model; $("srv").textContent = "Système en ligne"; $("srvdot").className = "dot on";
  }).catch(() => { $("srv").textContent = "Serveur injoignable"; $("srvdot").className = "dot err"; });
  if (!SR) $("micmode").textContent = "indisponible (Chrome/Safari)";
})();
</script>
</body>
</html>
